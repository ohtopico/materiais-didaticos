<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de Bhaskara passo a passo</title>
<style>
:root{--texto:#1f2a44;--fundo:#f6f8fb;--destaque:#0f766e;--borda:#cbd5e1;--painel:#ffffff;--certo:#166534;--erro:#9a3412;--realce:#fef3c7}
@media(prefers-color-scheme:dark){:root{--texto:#e8edf6;--fundo:#141b2b;--destaque:#5eead4;--borda:#334155;--painel:#1c2539;--certo:#86efac;--erro:#fdba74;--realce:#3b3516}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fundo);color:var(--texto);font:18px/1.6 "Trebuchet MS",Verdana,sans-serif;padding:20px}
main{max-width:720px;margin:auto}
h1{font-size:1.5rem;margin:0 0 6px}
h2{font-size:1.1rem;margin:0 0 6px}
.caixa{background:var(--painel);border:2px solid var(--borda);border-radius:14px;padding:14px 16px;margin:12px 0}
.formula{font-size:1.2rem;text-align:center;background:var(--realce);border-radius:10px;padding:8px;margin:8px 0}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label{display:flex;align-items:center;gap:6px;font-weight:bold}
input{font:inherit;width:90px;color:var(--texto);background:var(--fundo);border:2px solid var(--borda);border-radius:10px;padding:8px 10px;text-align:center}
button{font:inherit;font-weight:bold;padding:9px 16px;border-radius:10px;border:2px solid var(--destaque);background:none;color:var(--texto);cursor:pointer}
.botao-principal{background:var(--destaque);color:var(--fundo)}
input:focus-visible,button:focus-visible{outline:3px solid var(--destaque);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.conta{font-family:Consolas,"Courier New",monospace;font-size:1.05rem;margin:4px 0;padding-left:10px;border-left:4px solid var(--destaque);overflow-x:auto;white-space:nowrap}
.passo{animation:aparecer .3s}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.passo{animation:none}}
.erro{color:var(--erro);font-weight:bold}.certo{color:var(--certo);font-weight:bold}
small{opacity:.75}
</style></head><body><main>
<h1>Calculadora de Bhaskara passo a passo</h1>
<div class="caixa">
<p style="margin:0">Para uma equação do 2º grau <b>ax² + bx + c = 0</b>:</p>
<div class="formula">Δ = b² − 4ac &nbsp;&nbsp;e&nbsp;&nbsp; x = (−b ± √Δ) / 2a</div>
<div class="linha">
<label>a <input id="coeficiente-a" inputmode="decimal" value="1" aria-label="Coeficiente a"></label>
<label>b <input id="coeficiente-b" inputmode="decimal" value="-5" aria-label="Coeficiente b"></label>
<label>c <input id="coeficiente-c" inputmode="decimal" value="6" aria-label="Coeficiente c"></label>
<button class="botao-principal" id="calcular">Calcular</button>
</div>
<div class="linha"><small>Exemplos:</small>
<button class="exemplo" data-coeficientes="1,-5,6">x² − 5x + 6</button>
<button class="exemplo" data-coeficientes="1,-6,9">x² − 6x + 9</button>
<button class="exemplo" data-coeficientes="1,2,5">x² + 2x + 5</button>
<button class="exemplo" data-coeficientes="1,2,-5">x² + 2x − 5</button>
</div>
<p id="mensagem-erro" class="erro" aria-live="polite"></p>
</div>
<div id="passos" aria-live="polite"></div>
<div class="linha" id="controles" hidden><button class="botao-principal" id="proximo-passo">Próximo passo</button><button id="mostrar-tudo">Mostrar tudo</button></div>
<small>Use ponto ou vírgula para decimais. Esta página não coleta nem guarda nenhum dado.</small>
</main>
<script>
const CAMPOS_DOS_COEFICIENTES = ['coeficiente-a', 'coeficiente-b', 'coeficiente-c'];
const PRECISAO_EXIBIDA = 10000;      // números aparecem com até 4 casas decimais
const PRECISAO_DO_DELTA = 1e8;       // evita resíduos como 0,30000000000000004 no Δ
const TOLERANCIA_RAIZ_EXATA = 1e-9;
const TOLERANCIA_DE_ZERO = 1e-3;

const elemento = id => document.getElementById(id);

// ---------- Formatação ----------

function formatarNumero(numero) {
  const arredondado = Math.round(numero * PRECISAO_EXIBIDA) / PRECISAO_EXIBIDA;
  return String(arredondado).replace('.', ',').replace('-', '−');
}

function formatarEntreParenteses(numero) {
  return numero < 0 ? '(' + formatarNumero(numero) + ')' : formatarNumero(numero);
}

function formatarTermo(coeficiente, variavel, ehPrimeiroTermo) {
  if (coeficiente === 0) return '';
  const modulo = Math.abs(coeficiente);
  const textoDoTermo = (modulo === 1 && variavel) ? variavel : formatarNumero(modulo) + variavel;
  if (ehPrimeiroTermo) return (coeficiente < 0 ? '−' : '') + textoDoTermo;
  return ' ' + (coeficiente < 0 ? '−' : '+') + ' ' + textoDoTermo;
}

function escreverEquacao(a, b, c) {
  return formatarTermo(a, 'x²', true) + formatarTermo(b, 'x', false) + formatarTermo(c, '', false) + ' = 0';
}

function linhasDeConta(...contas) {
  return contas.map(conta => '<div class="conta">' + conta + '</div>').join('');
}

function observacao(texto) {
  return '<p><small>' + texto + '</small></p>';
}

// ---------- Matemática ----------

function calcularDelta(a, b, c) {
  return Math.round((b * b - 4 * a * c) * PRECISAO_DO_DELTA) / PRECISAO_DO_DELTA;
}

function analisarRaizDoDelta(delta) {
  const raiz = Math.sqrt(delta);
  const ehExata = Math.abs(raiz - Math.round(raiz)) < TOLERANCIA_RAIZ_EXATA;
  return { valor: raiz, ehExata, valorExato: ehExata ? Math.round(raiz) : raiz };
}

function calcularRaizes(a, b, delta, raizDoDelta) {
  const x1 = (-b + raizDoDelta) / (2 * a);
  const x2 = (-b - raizDoDelta) / (2 * a);
  return delta === 0 ? [x1] : [x1, x2];
}

// ---------- Passos da resolução ----------

function passoIdentificarCoeficientes(a, b, c) {
  return {
    titulo: '1. Identifique os coeficientes',
    conteudo: linhasDeConta(
      'Equação: ' + escreverEquacao(a, b, c),
      'a = ' + formatarNumero(a) + '  (acompanha x²)',
      'b = ' + formatarNumero(b) + '  (acompanha x)',
      'c = ' + formatarNumero(c) + '  (número sozinho)')
  };
}

function passoCalcularDelta(a, b, c, delta) {
  return {
    titulo: '2. Calcule o discriminante Δ',
    conteudo: linhasDeConta(
      'Δ = b² − 4 · a · c',
      'Δ = ' + formatarEntreParenteses(b) + '² − 4 · ' + formatarEntreParenteses(a) + ' · ' + formatarEntreParenteses(c),
      'Δ = ' + formatarNumero(b * b) + ' − ' + formatarEntreParenteses(4 * a * c),
      'Δ = ' + formatarNumero(delta))
      + observacao('Cuidado: um número negativo elevado ao quadrado fica positivo.')
  };
}

function passosSemRaizReal(delta) {
  return [
    {
      titulo: '3. Interprete o Δ',
      conteudo: linhasDeConta('Δ = ' + formatarNumero(delta) + ' é menor que zero')
        + '<p>Não existe raiz quadrada real de número negativo. <b>A equação não tem raízes reais.</b></p>'
    },
    { titulo: '4. Conclusão', conteudo: linhasDeConta('S = { }  (conjunto vazio)') }
  ];
}

function passoInterpretarDelta(delta) {
  const quantidadeDeRaizes = delta === 0
    ? 'Δ é zero: a equação tem <b>uma raiz real</b> (as duas raízes são iguais).'
    : 'Δ é positivo: a equação tem <b>duas raízes reais diferentes</b>.';
  return {
    titulo: '3. Interprete o Δ',
    conteudo: linhasDeConta('Δ = ' + formatarNumero(delta))
      + '<p>' + quantidadeDeRaizes + '</p>'
      + observacao('Δ &gt; 0: duas raízes. Δ = 0: uma raiz. Δ &lt; 0: nenhuma raiz real.')
  };
}

function passoSubstituirNaFormula(a, b, delta, raiz) {
  const textoDaRaiz = raiz.ehExata ? formatarNumero(raiz.valorExato) : '√' + formatarNumero(delta);
  const explicacaoDaRaiz = raiz.ehExata
    ? '√' + formatarNumero(delta) + ' = ' + formatarNumero(raiz.valorExato) + ', pois ' + formatarNumero(raiz.valorExato) + '² = ' + formatarNumero(delta) + '.'
    : '√' + formatarNumero(delta) + ' não é exata: usamos o valor aproximado ' + formatarNumero(raiz.valor) + '.';
  return {
    titulo: '4. Substitua na fórmula',
    conteudo: linhasDeConta(
      'x = (−b ± √Δ) / (2 · a)',
      'x = (−' + formatarEntreParenteses(b) + ' ± √' + formatarNumero(delta) + ') / (2 · ' + formatarEntreParenteses(a) + ')',
      'x = (' + formatarNumero(-b) + ' ± ' + textoDaRaiz + ') / ' + formatarNumero(2 * a))
      + observacao(explicacaoDaRaiz)
  };
}

function passoCalcularRaizes(a, b, delta, raiz, raizes) {
  const menosB = formatarNumero(-b);
  const doisA = formatarNumero(2 * a);
  if (delta === 0) {
    return { titulo: '5. Calcule as raízes', conteudo: linhasDeConta('x = ' + menosB + ' / ' + doisA, 'x = ' + formatarNumero(raizes[0])) };
  }
  const sinalDeResultado = raiz.ehExata ? ' = ' : ' ≈ ';
  const contaDaRaiz = (indice, sinal, numerador, resultado) =>
    'x' + indice + ' = (' + menosB + ' ' + sinal + ' ' + formatarNumero(raiz.valor) + ') / ' + doisA
    + ' = ' + formatarNumero(numerador) + ' / ' + doisA + sinalDeResultado + formatarNumero(resultado);
  return {
    titulo: '5. Calcule as raízes',
    conteudo: linhasDeConta(
      contaDaRaiz('₁', '+', -b + raiz.valor, raizes[0]),
      contaDaRaiz('₂', '−', -b - raiz.valor, raizes[1]))
  };
}

function passoConferirResultado(a, b, c, raiz, raizes) {
  const conferencias = raizes.map(x => {
    const resultado = a * x * x + b * x + c;
    const ehZero = Math.abs(resultado) < TOLERANCIA_DE_ZERO;
    const textoDoResultado = ehZero ? (raiz.ehExata ? '0' : '≈ 0') : formatarNumero(resultado);
    return linhasDeConta(
      'a·x² + b·x + c com x = ' + formatarNumero(x),
      formatarEntreParenteses(a) + ' · ' + formatarEntreParenteses(x) + '² + ' + formatarEntreParenteses(b) + ' · '
        + formatarEntreParenteses(x) + ' + ' + formatarEntreParenteses(c) + ' = ' + textoDoResultado);
  }).join('');
  const avisoDeAproximacao = raiz.ehExata ? '' : ' Com raízes aproximadas, o resultado fica muito perto de zero.';
  return {
    titulo: '6. Confira o resultado',
    conteudo: conferencias + observacao('Se a conta der zero, a raiz está certa.' + avisoDeAproximacao)
  };
}

function passoConclusao(raizes) {
  return { titulo: '7. Conclusão', conteudo: linhasDeConta('S = { ' + raizes.map(formatarNumero).join(' ; ') + ' }') };
}

function montarPassos(a, b, c) {
  const delta = calcularDelta(a, b, c);
  const passosIniciais = [passoIdentificarCoeficientes(a, b, c), passoCalcularDelta(a, b, c, delta)];
  if (delta < 0) return passosIniciais.concat(passosSemRaizReal(delta));

  const raiz = analisarRaizDoDelta(delta);
  const raizes = calcularRaizes(a, b, delta, raiz.valor);
  return passosIniciais.concat([
    passoInterpretarDelta(delta),
    passoSubstituirNaFormula(a, b, delta, raiz),
    passoCalcularRaizes(a, b, delta, raiz, raizes),
    passoConferirResultado(a, b, c, raiz, raizes),
    passoConclusao(raizes)
  ]);
}

// ---------- Tela ----------

let passos = [];
let passosVisiveis = 0;

function mostrarPassos() {
  elemento('passos').innerHTML = passos.map((passo, indice) =>
    '<div class="caixa passo" ' + (indice < passosVisiveis ? '' : 'hidden') + '><h2>' + passo.titulo + '</h2>' + passo.conteudo + '</div>'
  ).join('');
  const terminou = passosVisiveis >= passos.length;
  elemento('controles').hidden = !passos.length;
  elemento('proximo-passo').disabled = terminou;
  elemento('proximo-passo').textContent = terminou ? 'Fim do passo a passo' : 'Próximo passo';
}

function lerCoeficiente(id) {
  const texto = elemento(id).value.trim().replace(',', '.');
  return texto === '' ? NaN : Number(texto);
}

function mostrarErro(texto) {
  elemento('mensagem-erro').textContent = texto;
}

function calcular() {
  const [a, b, c] = CAMPOS_DOS_COEFICIENTES.map(lerCoeficiente);
  mostrarErro('');
  if ([a, b, c].some(isNaN)) return mostrarErro('Preencha a, b e c com números.');
  if (a === 0) return mostrarErro('Se a = 0, a equação deixa de ser do 2º grau. Escolha um a diferente de zero.');
  passos = montarPassos(a, b, c);
  passosVisiveis = 1;
  mostrarPassos();
}

function usarExemplo(botao) {
  botao.dataset.coeficientes.split(',').forEach((valor, indice) => {
    elemento(CAMPOS_DOS_COEFICIENTES[indice]).value = valor;
  });
  calcular();
}

elemento('calcular').onclick = calcular;
CAMPOS_DOS_COEFICIENTES.forEach(id => {
  elemento(id).onkeydown = evento => { if (evento.key === 'Enter') calcular(); };
});
document.querySelectorAll('.exemplo').forEach(botao => { botao.onclick = () => usarExemplo(botao); });
elemento('proximo-passo').onclick = () => {
  if (passosVisiveis < passos.length) { passosVisiveis++; mostrarPassos(); }
};
elemento('mostrar-tudo').onclick = () => { passosVisiveis = passos.length; mostrarPassos(); };
</script></body></html>
