<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montador de prompts P.A.C.T.O.</title>
<style>
:root{--ink:#1f2a44;--bg:#f6f8fb;--ac:#0f766e;--ln:#cbd5e1;--pn:#ffffff}
@media(prefers-color-scheme:dark){:root{--ink:#e8edf6;--bg:#141b2b;--ac:#5eead4;--ln:#334155;--pn:#1c2539}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Trebuchet MS",Verdana,sans-serif;padding:20px}
main{max-width:680px;margin:auto}
h1{font-size:1.5rem;margin:0 0 4px}
label{display:block;font-weight:bold;margin:14px 0 4px}
label span{font-weight:normal;opacity:.75;font-size:.9rem}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:10px 12px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#out{min-height:140px;margin-top:6px}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:bold;padding:10px 16px;border-radius:10px;border:2px solid var(--ac);background:none;color:var(--ink);cursor:pointer}
.go{background:var(--ac);color:var(--bg)}
.warn{margin-top:16px;padding:10px 14px;border:2px solid var(--ln);border-radius:10px;font-size:.95rem}
</style></head><body><main>
<h1>Montador de prompts P.A.C.T.O.</h1>
<p>Preencha os campos. O prompt se monta sozinho, pronto para copiar.</p>
<label for="p">Papel <span>quem a IA deve ser</span></label>
<input id="p" placeholder="professor experiente de Matemática">
<label for="a">Alvo <span>ano, turma e realidade da escola</span></label>
<input id="a" placeholder="6º ano, 30 alunos, aula de 50 minutos, sem internet">
<label for="c">Comando <span>a tarefa, com verbo claro</span></label>
<input id="c" placeholder="crie um plano de aula sobre introdução a frações">
<label for="t">Tom e formato <span>como entregar</span></label>
<input id="t" placeholder="tabela com etapa, tempo, atividade e material">
<label for="o">Observações <span>restrições e o que evitar</span></label>
<input id="o" placeholder="não invente fontes e avise o que preciso conferir">
<label for="out">Seu prompt</label>
<textarea id="out" readonly></textarea>
<div class="row"><button class="go" id="cp">Copiar prompt</button><button id="ex">Preencher com exemplo</button><button id="cl">Limpar</button></div>
<p id="msg" aria-live="polite"></p>
<div class="warn">Antes de enviar: não inclua nomes, laudos ou dados de alunos. Descreva a turma, não as pessoas. Esta página não coleta nenhum dado.</div>
</main>
<script>
const ids=['p','a','c','t','o'],$=id=>document.getElementById(id);
const L={p:'Atue como ',a:'Contexto: ',c:'Tarefa: ',t:'Formato: ',o:'Observações: '};
function build(){
  $('out').value=ids.filter(k=>$(k).value.trim()).map(k=>L[k]+$(k).value.trim().replace(/[.]$/,'')+'.').join('\n');
}
ids.forEach(k=>$(k).addEventListener('input',build));
$('ex').onclick=()=>{ids.forEach(k=>$(k).value=$(k).placeholder);build()};
$('cl').onclick=()=>{ids.forEach(k=>$(k).value='');build();$('msg').textContent=''};
$('cp').onclick=()=>{
  if(!$('out').value){$('msg').textContent='Preencha pelo menos um campo.';return}
  $('out').select();
  const ok=()=>$('msg').textContent='Copiado! Cole na sua IA e refine o resultado.';
  if(navigator.clipboard)navigator.clipboard.writeText($('out').value).then(ok,()=>{document.execCommand('copy');ok()});
  else{document.execCommand('copy');ok()}
};
</script></body></html>
